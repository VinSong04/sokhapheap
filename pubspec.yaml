name: run_tracker
description: "A Flutter running tracker app with clean MVVM architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  intl: ^0.20.2
  fl_chart: ^0.70.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
